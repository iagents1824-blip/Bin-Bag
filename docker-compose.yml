services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: binbag
      POSTGRES_USER: binbag
      POSTGRES_PASSWORD: binbag_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U binbag"]
      interval: 5s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.11
    environment:
      MEILI_MASTER_KEY: dev_master_key
    ports:
      - "7700:7700"
    volumes:
      - msdata:/meili_data

volumes:
  pgdata:
  msdata:
